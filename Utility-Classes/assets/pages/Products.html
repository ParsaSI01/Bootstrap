<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Products</title>

        <link rel="stylesheet" href="../../../assets/css/bootstrap.min.css" />
        <link rel="stylesheet" href="../css/stylesheet.css" />
    </head>

    <body>
        <section class="container vh-100 mt-3">
            <div class="container mt-5">
                <!-- Product Card 1 -->
                <div class="bg-white border border-2 p-4 m-3 w-25">
                    <div class="bg-light border mb-3 h-25"></div>
                    <div class="text-center">
                        <h5 class="text-dark mb-2">Product #1</h5>
                        <p class="text-muted mb-3">Short product description</p>
                        <div class="bg-primary text-white p-2">Price: $150</div>
                    </div>
                </div>

                <!-- Product Card 2 -->
                <div class="bg-white border border-2 p-4 m-3 w-25">
                    <div class="bg-light border mb-3 h-25"></div>
                    <div class="text-center">
                        <h5 class="text-dark mb-2">Product #2</h5>
                        <p class="text-muted mb-3">Short product description</p>
                        <div class="bg-success text-white p-2">Price: $250</div>
                    </div>
                </div>

                <!-- Product Card 3 -->
                <div class="bg-white border border-2 p-4 m-3 w-25">
                    <div class="bg-light border mb-3 h-25"></div>
                    <div class="text-center">
                        <h5 class="text-dark mb-2">Product #3</h5>
                        <p class="text-muted mb-3">Short product description</p>
                        <div class="bg-warning text-dark p-2">Price: $180</div>
                    </div>
                </div>
            </div>
        </section>

        <script src="../js/script.js"></script>
        <script src="../../../assets/js/bootstrap.bundle.min.js"></script>

</html>
